<style>
@import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap');

:root{
  --bg: #241C16;
  --bg-soft: #2E241C;
  --card: #F3ECDA;
  --card-line: #D8CBA8;
  --ink: #231E17;
  --ink-soft: #55493A;
  --brass: #B08D57;
  --brass-bright: #D8B978;
  --tab-laundry: #3B5B77;
  --tab-pest: #55693A;
  --tab-odor: #B0812C;
  --tab-stain: #9A4A32;
  --tab-storage: #6B5A8A;
  --tab-mold: #2F6B5E;
  --tab-kitchen: #8C3B57;
  --tab-season: #3E8B9E;

*{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html,body{ height:100%; }
body{

  background: var(--bg);
  color: var(--card);
  font-family: 'IBM Plex Sans KR', sans-serif;
  line-height: 1.65;
  overflow-x: hidden;
}
a{ color:inherit; }

.app{
  max-width: 480px;
  margin: 0 auto;
  min-height: 100vh;
  display:flex;
  flex-direction:column;
  padding-bottom: 30px;
}

header{

  border-bottom: 1px solid rgba(216,185,120,0.22);
  position: sticky;
  top:0;

  z-index: 5;
}
.title-row{

  align-items:center;
  gap:10px;

}
.hole{

}
h1{

  font-size: 21px;
  margin: 0;
  font-weight: 700;
}
.sub{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--brass-bright);
  margin: 0 0 14px 23px;
}

.search-box{
  display:flex;
  align-items:center;

  background: var(--bg-soft);
  border: 1px solid rgba(216,185,120,0.25);
  border-radius: 20px;

.search-box input{

}

.chips{

}
.chips::-webkit-scrollbar{ display:none; }
.chip{

  font-size: 12.5px;
  padding: 7px 13px;
  border-radius: 16px;
  border: 1px solid rgba(216,185,120,0.3);
  color: var(--card-line);
  background: transparent;

}
.chip.active{
  background: var(--brass-bright);
  color: var(--ink);

}
.chip.fav{ display:flex; align-items:center; gap:5px; }

main{
  flex:1;
  padding: 6px 18px 10px;
}

.result-count{

  font-size: 12px;
  color: var(--ink-soft);
  margin: 10px 0 12px;
}

.list{

  flex-direction:column;

}

.card-entry{

  font-size: 13px;

}

  background:transparent;
  cursor:pointer;

}
.empty .big{

  margin-bottom: 10px;
}

  position:fixed;
  inset:0;
  background: rgba(0,0,0,0.55);
  display:none;
  z-index: 20;
}

.sheet{

  left:0; right:0; bottom:0;

  color: var(--ink);

  overflow-y: auto;

  z-index: 21;
  padding: 10px 24px 34px;
}
.sheet.open{ transform: translateY(0); }
.sheet-handle{
  width:36px; height:4px;
  background: var(--card-line);
  border-radius: 2px;
  margin: 8px auto 14px;
}
.sheet .callno{
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.sheet h2{
  font-family:'Zilla Slab', serif;
  font-size: 22px;
  line-height:1.32;
  margin: 8px 0 4px;
}
.sheet .meta-sub{
  color: var(--ink-soft);
  font-size: 13.5px;
  margin-bottom: 16px;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--card-line);
}
.sheet h3{

  font-size: 15.5px;
  margin: 20px 0 8px;

.sheet ol, .sheet ul{ padding-left: 19px; margin:0 0 10px; }
.sheet li{ margin-bottom: 7px; font-size: 14.5px; }
.sheet .note{

  border-radius: 2px;
}
.close-x{

  font-size: 12px;
}
.sheet-fav{
  margin-top: 20px;
  width:100%;
  padding: 11px;
  border-radius: 8px;
  border: 1px solid var(--brass);
  background: transparent;
  color: var(--ink);
  font-family:'IBM Plex Sans KR', sans-serif;
  font-size: 13.5px;
  font-weight:600;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
}
.sheet-fav.active{ background: var(--brass); color:#fff; }

/* Share buttons */
.share-btn{
  margin-left: auto;
  border: 1px solid rgba(216,185,120,0.3);
  background: transparent;
  color: var(--brass-bright);
  border-radius: 50%;
  width: 34px; height:34px;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer;
  flex-shrink:0;
}
.share-btn:active{ background: rgba(216,185,120,0.15); }
.sheet-actions{ display:flex; align-items:center; gap:14px; }
.icon-btn{
  border:none; background:transparent; cursor:pointer;
  color: var(--ink-soft);
  display:flex; align-items:center;
}

/* Toast */
.toast{
  position:fixed;
  left:50%; bottom:24px;
  transform: translateX(-50%) translateY(20px);
  background: var(--brass-bright);
  color: var(--ink);
  font-family:'IBM Plex Sans KR', sans-serif;
  font-size: 13.5px;
  font-weight:600;
  padding: 12px 20px;
  border-radius: 22px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.35);
  opacity:0;
  pointer-events:none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 40;
  max-width: 88%;
  text-align:center;
}
.toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

/* Cover screen */
.cover{
  position:fixed; inset:0;
  background: var(--bg);
  z-index: 50;
  display:flex;
  align-items:center;
  justify-content:center;
  padding: 24px;
  transition: opacity .35s ease, visibility .35s ease;
}
.cover.hide{ opacity:0; visibility:hidden; pointer-events:none; }
.cover-inner{
  max-width: 360px;
  width:100%;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}
.cover-art{
  position:relative;
  width: 100%;
  height: 100px;
  margin-bottom: 6px;
}
.cover-card{
  position:absolute;
  left:50%;
  width: 68%;
  height: 62px;
  background: var(--card);
  border-radius: 4px;
  box-shadow: 0 10px 24px rgba(0,0,0,0.4);
}
.cc1{ top:0; transform: translateX(-50%) rotate(-6deg); }
.cc2{ top:14px; transform: translateX(-50%) rotate(3deg); background:#EFE6CE; }
.cc3{ top:28px; transform: translateX(-50%) rotate(-1deg); background:#EAE0C4; }
.cover-hole{
  width:16px; height:16px; border-radius:50%;
  border: 2px solid var(--brass-bright);
  margin-bottom: 18px;
}
.cover-title{
  font-family:'Zilla Slab', serif;
  font-size: 32px;
  font-weight:700;
  margin: 0 0 8px;
  color: var(--card);
}
.cover-tag{
  font-size: 14px;
  color: var(--card-line);
  margin: 0 0 22px;
  line-height:1.6;
}
.cover-stats{
  display:flex;
  align-items:center;
  gap: 18px;
  margin-bottom: 20px;
}
.cover-stats .stat{
  display:flex;
  flex-direction:column;
  align-items:center;
}
.cover-stats .stat b{
  font-family:'Zilla Slab', serif;
  font-size: 26px;
  color: var(--brass-bright);
  line-height:1;
}
.cover-stats .stat span{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  margin-top: 4px;
}
.stat-div{ width:1px; height:28px; background: rgba(216,185,120,0.3); }
.cover-cats{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap: 7px;
  margin-bottom: 30px;
}
.cover-cats span{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--card-line);
  border: 1px solid rgba(216,185,120,0.25);
  padding: 4px 10px;
  border-radius: 14px;
}
.cover-btn{
  width:100%;
  padding: 15px;
  border-radius: 26px;
  border:none;
  background: var(--brass-bright);
  color: var(--ink);
  font-family:'IBM Plex Sans KR', sans-serif;
  font-size: 15px;
  font-weight:700;
  cursor:pointer;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}
.cover-btn:active{ transform: scale(0.98); }

/* Coupang affiliate disclosure + buy links */
.disclosure{
  margin-top: 10px;
  font-size: 10.5px;
  line-height:1.5;
  color: #C9A24A;
  background: rgba(216,185,120,0.1);
  border: 1px solid rgba(216,185,120,0.25);
  border-radius: 6px;
  padding: 7px 10px;
}
.buy-links{
  margin-top: 20px;
}
.buy-links .buy-label{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
  margin-bottom: 8px;
}
.buy-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size: 13px;
  font-weight:600;
  padding: 8px 14px;
  margin: 0 6px 6px 0;
  border-radius: 18px;
  background: #B08D57;
  color:#fff;
  text-decoration:none;
}
.buy-chip:active{ opacity:0.85; }
</style>
</head>
<body>
<div class="cover" id="cover">

      <div class="cover-card cc1"></div>

<div class="app" id="mainApp">

      <button class="icon-btn" id="sheetShareBtn" title="이 카드 공유하기">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>

  <div class="buy-links" id="sheetBuy"></div>

<div class="toast" id="toast"></div>


<script>
/* ============================================================
   🛒 쿠팡파트너스 링크 연결 방법
   1) 쿠팡파트너스(partners.coupang.com)에서 상품별 링크를 만드세요.
   2) 아래 AFFILIATE_LINKS 객체에서 재료 이름 옆 ''(빈 칸)에
      본인의 쿠팡파트너스 링크 주소를 붙여넣으세요.
      예) '베이킹소다': 'https://link.coupang.com/a/여기에실제링크',
   3) 링크를 하나라도 채우면 화면에 카드별 "구매하기" 버튼과
      법적으로 반드시 필요한 고지 문구가 자동으로 함께 표시됩니다.
      (고지 문구는 임의로 지우지 마세요 - 공정거래위원회 지침상 필수입니다)
   4) 카드 속 "준비물" 문구에 아래 재료 이름이 포함되어 있으면
      해당 카드 상세보기에 자동으로 구매 버튼이 나타납니다.
   ============================================================ */
const AFFILIATE_LINKS = {
  /* 👇 아래 3개는 버튼이 뜨는 모습을 보여주기 위한 "샘플" 링크입니다.
     실제 쿠팡파트너스 수익 링크가 아니라 일반 검색 링크이니,
     실제 서비스 전에는 반드시 본인의 쿠팡파트너스 링크로 교체하세요. */
  '베이킹소다': 'https://link.coupang.com/a/gJNwX7Qusu',
  '과탄산소다': '',
  '구연산': '',
  '식초': 'https://link.coupang.com/a/gJNBwY2xps',
  '소독용 알코올': '',
  '과산화수소': '',
  '굵은소금': '',
  '레몬': '',
  '신문지': '',
  '결로방지테이프': '',
  '뽁뽁이': '',
  '핸드크림': '',
  '가죽 전용 크림': '',
  '베이비샴푸': '',
  '보풀제거기': 'https://link.coupang.com/a/gJNjFy6OWW',
  '투명 밀폐용기': '',
  '라벨 스티커': '',

    sub:'준비물: 주방세제, 베이킹소다 · 소요 시간: 30분',
    intro:'기름 성분은 물에 잘 녹지 않아 일반 세탁만으로는 잘 빠지지 않고, 김치 국물은 색과 기름기를 동시에 잡아야 합니다.',
    steps:['얼룩에 주방세제를 원액 그대로 바르고 칫솔로 살살 두드리듯 문지릅니다.','베이킹소다와 물을 되직하게 섞어 얼룩 위에 덧발라 10분간 둡니다.','미온수로 충분히 헹궈 세제와 베이킹소다를 씻어냅니다.','옅게 남았다면 세탁 전 그 부분만 다시 세제를 발라 애벌빨래하듯 비빕니다.'],
    extra:['진한 얼룩은 뜨거운 물에 먼저 닿으면 고정되니 찬물로 초벌 작업을 하세요.','실크나 울은 페이스트 대신 전문 세탁을 권장합니다.'],
    note:'기름 얼룩이 묻은 직후엔 밀가루나 베이비파우더를 뿌려 먼저 흡착시키면 이후 세탁이 훨씬 쉬워집니다.' },
  { id:'stain-ink', cat:'stain', title:'볼펜·잉크 얼룩 지우는 법',
    meta:'옷이나 가방에 묻은 볼펜, 잉크 얼룩을 알코올로 안전하게 지우는 방법을 알려드립니다.',
    sub:'준비물: 소독용 알코올, 흰 수건 · 소요 시간: 15분',
    intro:'잉크는 색소가 섬유에 빠르게 스며들기 때문에 물보다 알코올로 색소를 녹여내는 것이 효과적입니다.',
    steps:['얼룩 아래에 흰 수건이나 키친타월을 깔아 번짐을 막습니다.','소독용 알코올을 화장솜에 묻혀 얼룩을 두드리듯 톡톡 눌러줍니다. 문지르면 번질 수 있으니 누르는 동작만 반복합니다.','화장솜에 잉크가 옮겨오는 것이 보이면 깨끗한 면으로 계속 교체합니다.','얼룩이 옅어지면 찬물로 헹구고 평소처럼 세탁합니다.'],
    extra:['가죽이나 색이 진한 옷감은 눈에 띄지 않는 부분에 먼저 테스트해보세요.','마른 지 오래된 얼룩일수록 여러 번 반복해야 합니다.'],
    note:'잉크가 묻은 직후라면 문지르지 말고 마른 티슈로 먼저 눌러 흡수시키는 것이 번짐을 막는 핵심입니다.' },

  { id:'storage-closet', cat:'storage', title:'옷장 공간 두 배로 늘리는 세로 수납 접는 법',
    meta:'옷을 세워서 정리하는 세로 수납법으로 좁은 옷장 공간을 두 배로 활용하는 방법입니다.',
    sub:'준비물: 없음 · 소요 시간: 옷 10벌당 5분',
    intro:'옷을 눕혀서 쌓아두면 아래쪽 옷을 찾을 때마다 위에 쌓인 옷이 흐트러집니다. 세로로 세워두면 한눈에 보이고 공간도 넓게 쓸 수 있습니다.',
    steps:['티셔츠는 소매를 몸판 쪽으로 접고, 아래에서 위로 3등분 접어 직사각형으로 만듭니다.','완성된 직사각형을 눕히지 않고 책처럼 세워서 나란히 꽂습니다.','비슷한 색상이나 종류끼리 구역을 나눠 세우면 찾기 쉬워집니다.','옷이 쓰러지면 얇은 책꽂이나 박스로 칸막이를 만들어줍니다.'],
    extra:['니트류는 접힌 자국이 남을 수 있으니 얇은 옷부터 적용해보세요.','계절이 지난 옷은 압축팩으로 부피를 줄여 별도 보관하면 좋습니다.'],
    note:'정리 후 자주 흐트러지는 칸만 나에게 맞게 접는 방식을 바꿔가는 것이 오래 유지하는 비결입니다.' },
  { id:'storage-fridge', cat:'storage', title:'냉장고 정리, 투명 용기 하나로 유통기한 놓치지 않는 법',
    meta:'투명 용기와 구역 정리만으로 냉장고 속 식재료 유통기한을 놓치지 않는 방법입니다.',
    sub:'준비물: 투명 밀폐용기, 라벨 스티커 · 소요 시간: 30분',
    intro:'식재료를 잊고 상하게 만드는 가장 큰 이유는 무엇이 어디 있는지 안 보이기 때문입니다. 투명 용기와 배치만 바꿔도 낭비가 크게 줄어듭니다.',
    steps:['식재료를 모두 꺼내 유통기한을 확인하고 3일 이내로 먹어야 할 것을 따로 모읍니다.','투명 용기에 종류별로 담고 구입일이나 유통기한 라벨을 붙입니다.','가장 눈에 띄는 중간 칸을 먼저 먹을 음식 전용 구역으로 정합니다.','안쪽 깊숙한 칸은 장기 보관용, 문 쪽 칸은 자주 꺼내는 것으로 구역을 고정합니다.'],
    extra:['일주일에 한 번 먼저 먹을 음식 구역만 확인하는 습관이 효과를 배가시킵니다.','장보기 전 냉장고 사진을 찍어두면 중복 구매를 막을 수 있습니다.'],
    note:'냉장고를 가득 채우면 냉기 순환이 안 돼 보관 기간이 오히려 줄어드니 70% 정도만 채우는 것이 좋습니다.' },
  { id:'storage-cable', cat:'storage', title:'케이블·전선 정리, 엉키지 않게 보관하는 법',
    meta:'충전 케이블과 전선을 엉키지 않게 정리하고 보관하는 실전 방법을 소개합니다.',
    sub:'준비물: 화장지심(또는 종이심), 케이블타이 · 소요 시간: 15분',
    intro:'케이블은 아무렇게나 넣어두면 서로 엉키며 어떤 선이 어떤 용도인지 찾기 어려워집니다. 심을 이용해 세워 보관하면 한눈에 구분됩니다.',
    steps:['다 쓴 화장지심이나 키친타월심을 모아둡니다.','각 케이블을 느슨하게 말아 케이블타이나 빵끈으로 고정합니다.','고정된 케이블을 종류별로 심 안에 하나씩 세워 넣습니다.','서랍이나 바구니에 심을 나란히 세워 보관하고, 용도를 적은 라벨을 붙입니다.'],
    extra:['자주 쓰는 케이블은 손 닿기 쉬운 앞쪽에 배치하세요.','여행용 파우치에도 같은 방식으로 작게 응용할 수 있습니다.'],
    note:'케이블 끝에 작은 라벨 스티커를 붙여두면 콘센트에 꽂았을 때도 어떤 기기인지 바로 알 수 있습니다.' },

  { id:'mold-silicone', cat:'mold', title:'욕실 실리콘 틈새 곰팡이, 베이킹소다와 식초로 지우는 법',
    meta:'욕실 실리콘과 타일 줄눈에 낀 까만 곰팡이를 베이킹소다 페이스트와 식초로 제거하는 방법입니다.',
    sub:'준비물: 베이킹소다, 식초, 솔 · 소요 시간: 20~30분',
    intro:'실리콘 틈에 낀 물때를 오래 방치하면 유기물이 쌓이며 곰팡이가 자리 잡습니다. 베이킹소다의 연마력과 식초의 산성이 함께 작용하면 화학 세제 없이도 상당 부분 지울 수 있습니다.',
    steps:['베이킹소다 2스푼에 물을 조금씩 더해 되직한 페이스트를 만듭니다.','곰팡이가 낀 부분에 페이스트를 바르고 10분 정도 그대로 둡니다.','솔로 문질러 페이스트를 벗겨낸 뒤, 식초를 뿌려 다시 5~10분 둡니다.','물로 헹궈내고 마른 수건으로 물기를 완전히 닦아 습기가 남지 않게 합니다.'],
    extra:['식초와 락스는 유해 가스가 발생할 수 있어 절대 함께 섞지 않습니다. 락스로 마무리하려면 반드시 물로 헹구고 완전히 건조한 뒤에 사용하세요.','묵은 곰팡이 자국은 한 번에 지워지지 않을 수 있으니 며칠 간격으로 반복해보세요.'],
    note:'샤워 후 마른 수건이나 스퀴지로 물기를 한 번 걷어내는 습관만으로도 곰팡이가 다시 자리 잡는 속도를 크게 늦출 수 있습니다.' },
  { id:'mold-wall', cat:'mold', title:'벽지·벽 곰팡이, 과산화수소로 깨끗하게 관리하는 법',
    meta:'식초로도 안 지워지는 벽면 곰팡이 자국을 약국에서 구할 수 있는 과산화수소로 관리하는 방법입니다.',
    sub:'준비물: 3% 과산화수소, 분무기 · 소요 시간: 20분',
    intro:'오래된 곰팡이 얼룩은 표면만 닦아서는 잘 지워지지 않습니다. 과산화수소는 산화 작용으로 곰팡이 포자에 직접 작용해 얼룩과 냄새를 함께 줄이는 데 도움이 됩니다.',
    steps:['약국이나 드럭스토어에서 구할 수 있는 3% 농도 과산화수소를 빈 분무기에 옮겨 담습니다.','곰팡이가 있는 벽면에 충분히 분사하고 10분 정도 그대로 둡니다.','마른 걸레나 솔로 가볍게 닦아냅니다. 과산화수소는 사용 후 물과 산소로 분해돼 잔여물이 거의 남지 않습니다.','벽면을 완전히 건조시키고, 필요하면 하루 뒤 한 번 더 반복합니다.'],
    extra:['벽지 색이 진하거나 예민한 소재라면 눈에 띄지 않는 구석에 먼저 테스트해보세요.','곰팡이가 넓은 면적에 퍼져 있다면 원인이 되는 누수나 결로부터 먼저 점검하는 것이 근본적인 해결책입니다.'],
    note:'벽 곰팡이는 대부분 환기 부족과 결로가 원인이므로, 하루 세 번 10분씩 환기하는 습관이 재발 방지에 가장 중요합니다.' },
  { id:'mold-leather', cat:'mold', title:'가방·구두 가죽에 생긴 곰팡이, 손상 없이 제거하는 법',
    meta:'장마철 눅눅한 옷장에서 가죽 가방이나 구두에 생긴 흰 곰팡이를 손상 없이 닦아내는 방법입니다.',
    sub:'준비물: 소독용 알코올, 부드러운 천 · 소요 시간: 15분',
    intro:'가죽 표면의 흰 곰팡이는 대부분 표면 오염으로, 젖은 천으로 문지르면 오히려 가죽 속으로 밀어 넣을 수 있습니다. 알코올을 소량만 사용해 가볍게 닦아내는 것이 안전합니다.',
    steps:['부드러운 천에 소독용 알코올을 소량 묻힙니다. 흠뻑 적시지 않습니다.','곰팡이가 핀 부분을 살살 문질러 닦아냅니다.','완전히 마른 천으로 알코올 흔적을 한 번 더 닦아 습기를 남기지 않습니다.','그늘지고 통풍이 잘되는 곳에서 완전히 건조시킵니다.'],
    extra:['가죽 종류에 따라 색이 빠질 수 있으니 눈에 띄지 않는 안쪽에서 먼저 테스트하세요.','보관할 때는 신문지나 실리카겔 제습제를 함께 넣어두면 재발을 줄일 수 있습니다.'],
    note:'가죽 제품은 밀폐된 비닐보다 통풍되는 부직포 커버에 보관하는 것이 곰팡이 예방에 더 효과적입니다.' },

  { id:'kitchen-microwave', cat:'kitchen', title:'전자레인지 냄새, 식초 스팀 하나로 없애는 법',
    meta:'찌든 음식 냄새가 밴 전자레인지를 식초 스팀만으로 간단하게 청소하고 탈취하는 방법입니다.',
    sub:'준비물: 식초, 물, 내열 용기 · 소요 시간: 10분',
    intro:'전자레인지 냄새는 튄 음식물이 벽면에 눌어붙으며 나는 경우가 대부분입니다. 식초 수증기로 찌든 때를 불려주면 닦아내기가 훨씬 쉬워집니다.',
    steps:['내열 용기에 물 한 컵과 식초 4큰술을 넣습니다.','전자레인지에 넣고 3~4분 가열해 수증기를 충분히 냅니다.','문을 닫은 채로 5분 정도 그대로 두어 벽면의 찌든 때를 불립니다.','마른 행주나 키친타월로 내부와 회전판을 닦아냅니다.'],
    extra:['식초 냄새가 부담스럽다면 식초 대신 레몬즙 4작은술이나 레몬 껍질로 대체해도 비슷한 효과를 볼 수 있습니다.','기름때가 심하게 눌어붙은 자리는 베이킹소다 반 스푼을 젖은 행주에 묻혀 추가로 문질러주세요.'],
    note:'청소 직후 문을 살짝 열어두면 남은 식초 냄새가 빠르게 사라지고, 오히려 음식 냄새를 중화하는 효과도 있습니다.' },
  { id:'kitchen-cutting-board', cat:'kitchen', title:'도마 비린내와 얼룩, 소금과 레몬으로 없애는 법',
    meta:'생선, 고기를 손질한 도마에 남은 비린내와 얼룩을 소금과 레몬으로 위생적으로 없애는 방법입니다.',
    sub:'준비물: 굵은소금, 레몬(또는 레몬즙) · 소요 시간: 5분',
    intro:'도마의 칼집 사이에는 세제로 닦아도 음식물과 냄새가 남기 쉽습니다. 굵은소금의 물리적 세정력과 레몬의 산 성분을 함께 쓰면 얼룩과 냄새를 동시에 잡을 수 있습니다.',
    steps:['물기를 살짝 적신 도마 위에 굵은소금을 넉넉히 뿌립니다.','레몬을 반으로 잘라 단면으로 도마 전체를, 특히 칼집 사이를 문지릅니다.','소금과 레몬즙이 묻은 채로 2~3분 정도 그대로 둡니다.','미지근한 물로 헹구고 세워서 물기가 잘 빠지도록 건조합니다.'],
    extra:['생선 비린내가 유독 심하다면 소금·레몬 세척 후 베이킹소다에 뜨거운 물을 부어 한 번 더 헹궈주면 효과가 더 좋습니다.','고기·생선용과 채소용 도마를 분리해서 쓰면 냄새와 교차 오염을 함께 줄일 수 있습니다.'],
    note:'도마 냄새의 상당 부분은 세척 후 남은 물기에서 시작되므로, 눕혀 보관하지 않고 세워서 완전히 말리는 습관이 중요합니다.' },
  { id:'kitchen-kettle', cat:'kitchen', title:'전기포트 하얀 물때, 구연산으로 안전하게 없애는 법',
    meta:'전기포트 바닥에 쌓이는 하얀 석회질 물때를 구연산이나 식초로 안전하게 제거하는 방법입니다.',
    sub:'준비물: 구연산(또는 식초) · 소요 시간: 30분',
    intro:'전기포트의 하얀 물때는 물속 칼슘, 마그네슘 성분이 가열되며 남는 석회질입니다. 주방세제로는 잘 지워지지 않지만, 산성 성분인 구연산이나 식초로는 비교적 쉽게 분해할 수 있습니다.',
    steps:['전기포트에 물을 2/3 정도 채웁니다.','구연산 1~2큰술(또는 식초 1~2큰술)을 넣습니다.','전원을 켜서 물을 끓인 뒤, 끄고 10~20분 정도 그대로 둡니다.','물을 버리고 깨끗한 물로 2~3회 헹군 뒤, 한 번 더 맹물을 끓였다가 버려 잔여물과 냄새를 없앱니다.'],
    extra:['프린팅이 있는 손잡이나 플라스틱 부품은 색이 빠질 수 있으니 장시간 담가두지 않도록 주의하세요.','물때가 자주 낀다면 한 달에 한 번 정도 정기적으로 관리하는 것이 좋습니다.'],
    note:'물때를 그대로 두면 세균이 번식하기 쉬운 환경이 되고 열전도 효율도 떨어지므로, 주기적인 관리가 위생과 전기료 모두에 도움이 됩니다.' },

  { id:'season-condensation', cat:'season', title:'창문에 맺히는 결로, 곰팡이 생기기 전에 관리하는 법',
    meta:'겨울철 창문에 맺히는 물방울(결로)을 환기와 간단한 도구로 줄이고 곰팡이를 예방하는 방법입니다.',
    sub:'준비물: 신문지, 결로방지테이프(또는 뽁뽁이) · 소요 시간: 매일 10분',
    intro:'결로는 실내외 온도 차와 높은 실내 습도가 겹칠 때 생깁니다. 방치하면 창틀과 벽에 곰팡이로 이어지기 쉬워, 물방울이 맺히는 즉시 관리하는 것이 중요합니다.',
    steps:['물방울이 맺혀 있다면 마른 걸레로 바로 닦아내고, 선풍기나 드라이기로 한 번 더 건조시킵니다.','하루 세 번, 10분 정도 창문을 열어 환기하며 실내 습도를 40~60% 수준으로 유지합니다.','창틀 아래에 수건 대신 신문지를 깔아두면 여분의 습기를 흡수합니다.','결로가 심한 창문에는 결로방지테이프나 단열 뽁뽁이를 붙여 창문 표면 온도를 높여줍니다.'],
    extra:['난방을 세게 틀수록 공기 중 수증기 양도 늘어 결로가 심해질 수 있으니, 적정 온도를 유지하며 환기를 병행하세요.','옷장이나 신발장에도 숯, 신문지 등을 넣어두면 습기 관리에 도움이 됩니다.'],
    note:'결로를 방치한 자리는 곰팡이로 이어지기 쉬우므로, 물방울이 보이는 즉시 닦아내는 습관이 가장 확실한 예방법입니다.' },
  { id:'season-static', cat:'season', title:'겨울철 정전기, 옷 입기 전 미리 막는 법',
    meta:'건조한 겨울철 옷과 손끝에서 반복되는 정전기를 미리 예방하는 생활 밀착 방법입니다.',
    sub:'준비물: 핸드크림(또는 정전기 방지 스프레이) · 소요 시간: 1분',
    intro:'정전기는 공기가 건조할수록, 마찰이 클수록 잘 발생합니다. 옷을 입기 전 섬유 표면에 수분막을 만들어주면 전하 이동이 완화되어 정전기가 줄어듭니다.',
    steps:['외출 전 손에 남은 핸드크림을 니트 소매 안쪽이나 코트 안감에 살짝 발라줍니다.','머리카락이 정전기로 뻗친다면 손끝에 아주 소량의 핸드크림이나 로션을 묻혀 머리카락 끝을 가볍게 쓸어줍니다.','자동차 문이나 금속 손잡이를 만지기 전, 열쇠나 동전 같은 금속을 먼저 짧게 접촉시켜 방전시킵니다.','세탁 시 헹굼 단계에서 섬유유연제를 사용하면 옷감 마찰이 줄어 정전기 발생 빈도가 낮아집니다.'],
    extra:['섬유유연제는 면, 울 소재에는 효과가 좋지만 폴리에스터 같은 합성섬유에는 효과가 제한적일 수 있습니다.','실내가 건조할 때는 가습기나 젖은 수건을 널어 습도를 40% 이상으로 유지하는 것도 도움이 됩니다.'],
    note:'정전기 방지 스프레이를 옷 안쪽에 가볍게 뿌려두는 것도 외출 전 간단하게 쓸 수 있는 방법입니다.' },
  { id:'season-closet-damp', cat:'season', title:'눅눅한 옷장, 제습제 없이 습기 줄이는 법',
    meta:'장마철이나 겨울철 눅눅해지는 옷장 습기를 숯, 신문지 같은 재료로 관리하는 방법입니다.',
    sub:'준비물: 숯, 신문지(또는 베이킹소다) · 소요 시간: 10분',
    intro:'옷장 안에 습기가 차면 냄새는 물론 곰팡이로도 이어지기 쉽습니다. 값비싼 제습제가 없어도 숯이나 신문지 같은 재료로 어느 정도 습기를 관리할 수 있습니다.',
    steps:['숯을 뜨거운 물로 한 번 씻어 말린 뒤, 통풍되는 그물망이나 작은 바구니에 담아 옷장 구석에 놓아둡니다.','옷 사이사이나 서랍 바닥에 신문지를 깔아 여분의 습기를 흡수시킵니다.','베이킹소다를 뚜껑을 열어둔 작은 통에 담아 함께 넣어두면 습기와 냄새를 동시에 잡을 수 있습니다.','한 달에 한 번은 옷장 문을 활짝 열어 환기하고, 숯과 신문지는 젖은 정도를 보고 교체합니다.'],
    extra:['옷을 옷장에 너무 빽빽하게 넣으면 공기가 통하지 않아 습기가 쉽게 찹니다. 여유 공간을 두고 정리하세요.','장마철에는 제습제나 숯의 교체 주기를 평소보다 짧게 잡는 것이 좋습니다.'],
    note:'옷장 습기를 방치하면 곰팡이와 냄새로 이어지기 쉬우므로, 정기적인 환기가 가장 기본이자 효과적인 관리법입니다.' },

  { id:'cooking-egg', cat:'cooking', title:'삶은 계란 껍질 한 번에 쏙 까지는 법',
    meta:'삶을 때부터 식힐 때까지, 계란 껍질을 깨끗하게 쏙 까지게 만드는 손쉬운 방법을 소개합니다.',
    sub:'준비물: 식초, 소금 · 소요 시간: 삶는 시간 + 5분',
    intro:'계란 껍질이 잘 안 벗겨지는 건 신선한 달걀일수록 흰자와 속껍질이 단단히 붙어있기 때문입니다. 삶는 물에 재료를 더하고, 삶은 뒤 급랭시키는 두 단계만 지키면 훨씬 수월해집니다.',
    steps:['냉장고에서 꺼낸 달걀은 삶기 전 실온에 20~30분 두어 온도차로 인한 파열을 줄입니다.','물에 소금 1큰술과 식초 1큰술을 넣고 달걀을 삶습니다. 소금은 삼투압으로 껍질과 흰자 사이를 벌려주고, 식초는 혹시 깨졌을 때 흰자가 흘러나오지 않게 응고시켜 줍니다.','다 삶은 달걀은 바로 건져 찬물(또는 얼음물)에 담가 충분히 식힙니다.','껍질에 살짝 금을 낸 뒤 찬물 속에서 굴리듯 까면 속껍질까지 한 번에 벗겨집니다.'],
    extra:['냄비 뚜껑을 덮고 살살 흔들어 껍질에 잔금을 낸 뒤 까면 더 매끈하게 벗겨집니다.','오래된 달걀일수록 흰자와 껍질 사이 공간이 넓어 오히려 껍질이 잘 벗겨집니다.'],
    note:'여러 개를 한 번에 까야 한다면, 껍질을 깐 뒤 뚜껑 있는 통에 물과 함께 넣고 흔드는 방법도 시간을 크게 줄여줍니다.' },
  { id:'cooking-pot-burn', cat:'cooking', title:'냄비 탄 자국·눌은 자국 없애는 법',
    meta:'밥이나 국물이 눌어붙어 새까맣게 탄 냄비 바닥을 세제 없이 베이킹소다로 지우는 방법입니다.',
    sub:'준비물: 베이킹소다, 물 · 소요 시간: 20~30분',
    intro:'냄비 바닥에 탄 자국은 탄수화물과 단백질이 고온에서 눌어붙어 생긴 것으로, 억지로 긁으면 냄비 코팅이 상할 수 있습니다. 베이킹소다로 불려서 떼어내는 것이 안전합니다.',
    steps:['탄 냄비에 눌은 자국이 잠길 정도로 물을 붓습니다.','베이킹소다 2~3큰술을 넣고 끓입니다.','끓기 시작하면 불을 끄고 그대로 20~30분 식힙니다.','나무 주걱이나 부드러운 수세미로 문지르면 탄 자국이 쉽게 떨어져 나옵니다.'],
    extra:['스테인리스 냄비는 한 번에 안 지워지면 같은 과정을 반복해도 괜찮지만, 코팅 냄비는 철수세미 대신 부드러운 수세미만 사용하세요.','눌은 정도가 심하면 베이킹소다를 넣고 다시 한번 짧게 끓이면 효과가 더 좋습니다.'],
    note:'밥을 짓거나 국을 끓일 때 불 조절만 조금 신경 써도 눌음 자체를 크게 줄일 수 있습니다.' },
  { id:'cooking-veggie-storage', cat:'cooking', title:'상추·대파, 마트에서 산 그대로 오래 보관하는 법',
    meta:'쉽게 무르는 잎채소와 대파를 키친타월과 세로 보관법으로 2~3배 오래 신선하게 유지하는 방법입니다.',
    sub:'준비물: 키친타월(또는 신문지), 지퍼백 · 소요 시간: 10분',
    intro:'잎채소가 빨리 무르는 가장 큰 이유는 씻은 뒤 남은 물기입니다. 사 온 그대로, 씻지 않은 상태로 물기만 관리해 세워 보관하면 신선함이 훨씬 오래갑니다.',
    steps:['상추는 씻지 말고 마른 키친타월로 잎 사이사이를 감싸 지퍼백에 넣고, 잎이 위를 향하게 세워서 냉장 보관합니다.','대파는 물기를 제거한 뒤 신문지로 감싸거나, 뿌리 쪽이 아래로 가게 세워서 보관합니다.','바로 쓰지 않을 대파는 씻어 송송 썬 뒤 물기를 완전히 빼고 밀폐용기에 소분해 냉동 보관합니다.','채소칸의 습도가 너무 낮으면 마르고, 너무 높으면 무르므로 키친타월이 축축해지면 새것으로 교체합니다.'],
    extra:['상추는 이 방법으로 3~4주까지도 신선함이 유지될 수 있습니다.','토마토처럼 후숙 과일 채소는 오히려 냉장 보관하면 맛이 떨어지니 서늘한 실온 보관이 더 좋습니다.'],
    note:'채소를 씻어서 바로 보관하면 표면 보호막이 손상돼 물러지는 속도가 더 빨라지므로, 먹기 직전에 씻는 것이 신선도 유지의 핵심입니다.' },

  { id:'appliance-washer', cat:'appliance', title:'세탁기 통돌이 냄새, 베이킹소다·식초 통세척으로 없애는 법',
    meta:'빨래에서 퀴퀴한 냄새가 날 때 세탁기 통 내부를 베이킹소다와 식초로 셀프 세척하는 방법입니다.',
    sub:'준비물: 베이킹소다, 식초(또는 과탄산소다) · 소요 시간: 4시간(담금 포함)',
    intro:'세탁기 통 뒤편은 완전히 마르지 않아 세제 찌꺼기와 곰팡이가 쌓이기 쉬운 구조입니다. 세제를 아무리 많이 써도 통 자체가 오염되어 있으면 냄새가 계속 납니다.',
    steps:['세탁조에 뜨거운 물을 가득 채웁니다.','베이킹소다 반 컵과 식초 1컵을 넣습니다.','통세척 모드(없다면 표준 코스)로 4시간 이상 담가둡니다.','헹굼과 탈수를 진행하고, 세탁기 뚜껑을 열어 내부를 완전히 건조시킵니다.'],
    extra:['오염이 심하면 과탄산소다를 추가하거나, 베이킹소다·구연산·과탄산소다를 1:1:1로 섞어 사용하면 더 효과적입니다.','세제 통과 고무 패킹은 별도로 분리해 칫솔로 닦아주면 냄새 재발을 줄일 수 있습니다.'],
    note:'월 1회 정도 정기적으로 통세척을 하고, 사용 후에는 항상 문이나 뚜껑을 열어 건조시키는 것이 냄새 예방의 핵심입니다.' },
  { id:'appliance-fridge-smell', cat:'appliance', title:'냉장고 냄새, 베이킹소다와 숯으로 잡는 법',
    meta:'여러 음식 냄새가 섞인 냉장고를 베이킹소다와 숯, 커피 찌꺼기로 탈취하는 방법을 소개합니다.',
    sub:'준비물: 베이킹소다(또는 숯, 커피 찌꺼기) · 소요 시간: 15분 + 지속 관리',
    intro:'냉장고 냄새는 여러 음식의 휘발성 성분이 밀폐된 공간에 섞이며 나는 것입니다. 냉장고를 청소한 뒤에도 냄새 흡착제를 놓아두면 재발을 줄일 수 있습니다.',
    steps:['냉장고 속 유통기한이 지난 음식과 정체불명의 용기를 먼저 정리합니다.','선반과 서랍을 꺼내 미온수에 희석한 베이킹소다 물로 닦고 완전히 건조시킵니다.','베이킹소다나 마른 숯, 다 쓴 커피 찌꺼기를 뚜껑을 연 작은 통에 담아 냉장실과 냉동실에 각각 놓아둡니다.','2~3주에 한 번씩 흡착제를 교체하거나 햇볕에 말려 재사용합니다.'],
    extra:['김치나 젓갈처럼 냄새가 강한 음식은 밀폐 용기에 담아 다른 음식과 분리 보관하면 냄새 섞임을 줄일 수 있습니다.','레몬이나 오렌지 껍질을 잘라 넣어두면 은은한 향으로 탈취 효과를 더할 수 있습니다.'],
    note:'근본적인 냄새 예방을 위해서는 음식물을 밀폐 보관하는 습관과 정기적인 냉장고 정리가 흡착제보다 더 중요합니다.' },
  { id:'appliance-aircon-filter', cat:'appliance', title:'에어컨·선풍기 필터 청소, 곰팡이 냄새 막는 법',

let currentCat = 'all';
let currentQuery = '';
let showFavOnly = false;
let favorites = [];

const listEl = document.getElementById('list');
const chipsEl = document.getElementById('chips');
const countEl = document.getElementById('resultCount');
const searchInput = document.getElementById('searchInput');

function catInfo(key){ return CATS.find(c => c.key === key); }

function renderChips(){
  const favCount = favorites.length;
  let html = `<button class="chip ${currentCat==='all' && !showFavOnly ? 'active':''}" data-type="all">전체</button>`;
  CATS.forEach(c => {
    html += `<button class="chip ${currentCat===c.key && !showFavOnly ? 'active':''}" data-type="cat" data-key="${c.key}">${c.name}</button>`;
  });
  html += `<button class="chip fav ${showFavOnly ? 'active':''}" data-type="fav">★ 즐겨찾기${favCount ? ' '+favCount : ''}</button>`;
  chipsEl.innerHTML = html;
  chipsEl.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const type = btn.dataset.type;
      if(type === 'all'){ currentCat='all'; showFavOnly=false; }
      else if(type === 'cat'){ currentCat = btn.dataset.key; showFavOnly=false; }
      else if(type === 'fav'){ showFavOnly = !showFavOnly; }
      renderChips();
      renderList();
    });
  });
}

function starIcon(filled){
  return filled
    ? '<svg viewBox="0 0 24 24" fill="#B08D57" stroke="#B08D57" stroke-width="1.5"><polygon points="12 2 15.09 8.63 22 9.27 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.27 8.91 8.63"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="#55493A" stroke-width="1.5"><polygon points="12 2 15.09 8.63 22 9.27 16.5 14.14 18.18 21 12 17.27 5.82 21 7.5 14.14 2 9.27 8.91 8.63"/></svg>';
}

function filteredTips(){
  return TIPS.filter(t => {
    if(showFavOnly && !favorites.includes(t.id)) return false;
    if(!showFavOnly && currentCat !== 'all' && t.cat !== currentCat) return false;
    if(currentQuery){
      const q = currentQuery.toLowerCase();
      const hay = (t.title + ' ' + t.meta + ' ' + catInfo(t.cat).name).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderList(){
  const items = filteredTips();
  countEl.textContent = `카드 ${items.length}장`;
  if(items.length === 0){
    listEl.innerHTML = `<div class="empty"><div class="big">🗂️</div>${showFavOnly ? '아직 즐겨찾기한 카드가 없어요.' : '검색 결과가 없어요. 다른 키워드로 찾아보세요.'}</div>`;
    return;
  }
  listEl.innerHTML = items.map(t => {
    const c = catInfo(t.cat);
    const fav = favorites.includes(t.id);
    return `
    <div class="card-entry" style="--accent:${c.color}" data-id="${t.id}">
      <div class="body">
        <span class="tag">${c.name}</span>
        <h3>${t.title}</h3>
        <p>${t.meta}</p>
      </div>
      <button class="star-btn" data-fav="${t.id}">${starIcon(fav)}</button>
    </div>`;
  }).join('');

  listEl.querySelectorAll('.card-entry').forEach(el => {
    el.addEventListener('click', (e) => {
      if(e.target.closest('.star-btn')) return;
      openSheet(el.dataset.id);
    });
  });
  listEl.querySelectorAll('.star-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleFav(btn.dataset.fav);
    });
  });
}

async function loadFavorites(){
  try{
    const res = await window.storage.get('favorites', false);
    favorites = res && res.value ? JSON.parse(res.value) : [];
  }catch(err){
    favorites = [];
  }
}

async function saveFavorites(){
  try{
    await window.storage.set('favorites', JSON.stringify(favorites), false);
  }catch(err){
    console.error('즐겨찾기 저장 실패', err);
  }
}

function toggleFav(id){
  if(favorites.includes(id)){
    favorites = favorites.filter(f => f !== id);
  }else{
    favorites.push(id);
  }
  saveFavorites();
  renderChips();
  renderList();
  if(sheet.classList.contains('open') && sheet.dataset.currentId === id){
    updateSheetFavBtn(id);
  }
}

const overlay = document.getElementById('overlay');
const sheet = document.getElementById('sheet');

function updateSheetFavBtn(id){
  const isFav = favorites.includes(id);
  const btn = document.getElementById('sheetFavBtn');
  btn.className = 'sheet-fav' + (isFav ? ' active' : '');
  btn.innerHTML = (isFav ? '★ 즐겨찾기 해제' : '☆ 즐겨찾기에 담기');
}

function renderBuyLinks(t){
  const buyEl = document.getElementById('sheetBuy');
  const matched = Object.keys(AFFILIATE_LINKS)
    .filter(k => AFFILIATE_LINKS[k] && t.sub.includes(k))
    .map(k => ({ name:k, url:AFFILIATE_LINKS[k] }));
  const extra = TIP_EXTRA_LINKS[t.id] || [];
  const items = matched.concat(extra.filter(e => e.url));
  if(items.length === 0){
    buyEl.innerHTML = '';
    return;
  }
  const chips = items.map(item =>
    `<a class="buy-chip" href="${item.url}" target="_blank" rel="noopener sponsored">🛒 ${item.name} 제품구경하기</a>`
  ).join('');
  buyEl.innerHTML = `<div class="buy-label">이 카드에 필요한 재료</div>${chips}`;
}

function openSheet(id){
  const t = TIPS.find(x => x.id === id);
  if(!t) return;
  const c = catInfo(t.cat);
  sheet.dataset.currentId = id;
  document.getElementById('sheetCallno').textContent = `${c.name} · 생활도서관`;
  document.getElementById('sheetTitle').textContent = t.title;
  document.getElementById('sheetSub').textContent = t.sub;
  document.getElementById('sheetIntro').textContent = t.intro;
  document.getElementById('sheetSteps').innerHTML = t.steps.map(s => `<li>${s}</li>`).join('');
  document.getElementById('sheetExtra').innerHTML = t.extra.map(s => `<li>${s}</li>`).join('');
  document.getElementById('sheetNote').textContent = '💡 ' + t.note;
  renderBuyLinks(t);
  updateSheetFavBtn(id);
  overlay.classList.add('open');
  sheet.classList.add('open');
}

function closeSheet(){
  overlay.classList.remove('open');
  sheet.classList.remove('open');
}

document.getElementById('closeBtn').addEventListener('click', closeSheet);
overlay.addEventListener('click', closeSheet);
document.getElementById('sheetFavBtn').addEventListener('click', () => {
  toggleFav(sheet.dataset.currentId);
});

let debounceTimer;
searchInput.addEventListener('input', (e) => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    currentQuery = e.target.value.trim();
    renderList();
  }, 150);
});

/* Toast */
let toastTimer;
function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}

/* Cover screen */
function renderCoverCats(){
  document.getElementById('coverCats').innerHTML =
    CATS.map(c => `<span>${c.name}</span>`).join('');
}
document.getElementById('startBtn').addEventListener('click', () => {
  document.getElementById('cover').classList.add('hide');
});

/* Share: whole app */
async function shareApp(){
  const shareData = {
    title: '생활도서관 - 생활의 지혜 미니앱',
    text: '세탁, 곰팡이, 냄새, 자동차 관리까지 - 생활 꿀팁 36가지를 카드로 모은 미니앱이에요!',
    url: window.location.href
  };
  try{
    if(navigator.share){
      await navigator.share(shareData);
      return;
    }
  }catch(err){ return; }
  try{
    await navigator.clipboard.writeText(shareData.url);
    showToast('링크를 복사했어요. 카카오톡이나 문자에 붙여넣어 보내보세요 📋');
  }catch(err){
    showToast('이 파일을 카카오톡이나 이메일로 그대로 보내면 상대방도 바로 열어볼 수 있어요 📎');
  }
}
document.getElementById('shareBtn').addEventListener('click', shareApp);

/* Share: single card */
async function shareCard(id){
  const t = TIPS.find(x => x.id === id);
  if(!t) return;
  const c = catInfo(t.cat);
  const text = `[생활도서관 · ${c.name}]\n${t.title}\n\n${t.meta}\n\n${t.sub}`;
  try{
    if(navigator.share){
      await navigator.share({ title: t.title, text });
      return;
    }
  }catch(err){ return; }
  try{
    await navigator.clipboard.writeText(text);
    showToast('카드 내용을 복사했어요. 원하는 곳에 붙여넣어 보내보세요 📋');
  }catch(err){
    showToast('공유하기가 지원되지 않는 브라우저예요.');
  }
}
document.getElementById('sheetShareBtn').addEventListener('click', () => {
  if(sheet.dataset.currentId) shareCard(sheet.dataset.currentId);
});

(async function init(){
  renderCoverCats();
  const hasAnyAffiliateLink = Object.values(AFFILIATE_LINKS).some(v => v)
    || Object.values(TIP_EXTRA_LINKS).some(arr => arr.some(e => e.url));
  if(hasAnyAffiliateLink){
    document.getElementById('disclosure').style.display = 'block';
  }
  await loadFavorites();
  renderChips();
  renderList();
})();
</script>
